<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Python — Nhật ký học tập</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🐍</span>
      <span class="brand-name">Learning Python</span>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="videos">Video</button>
      <button class="tab-btn" data-tab="notes">Ghi chú</button>
      <button class="tab-btn" data-tab="lessons">Bài học</button>
      <button class="tab-btn" data-tab="calendar">Lịch</button>
    </nav>
  </header>

  <main>
    <!-- VIDEOS TAB -->
    <section id="videos" class="tab-panel active">
      <div class="panel-header">
        <h2>Video bài giảng (YouTube)</h2>
        <button id="addVideoBtn" class="btn-primary">+ Thêm video</button>
      </div>

      <form id="videoForm" class="card form-card hidden">
        <div class="field">
          <label for="videoUrl">Link YouTube</label>
          <input id="videoUrl" type="text" placeholder="https://www.youtube.com/watch?v=..." required>
        </div>
        <div class="field">
          <label for="videoTitle">Tiêu đề</label>
          <input id="videoTitle" type="text" placeholder="VD: Buổi 1 - Biến và kiểu dữ liệu" required>
        </div>
        <div class="field">
          <label for="videoDate">Ngày học</label>
          <input id="videoDate" type="date">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Lưu</button>
          <button type="button" id="cancelVideoBtn" class="btn-ghost">Hủy</button>
        </div>
      </form>

      <div id="videoList" class="video-grid"></div>
      <p id="videoEmpty" class="empty-state hidden">Chưa có video nào. Nhấn "Thêm video" để bắt đầu.</p>
    </section>

    <!-- NOTES TAB -->
    <section id="notes" class="tab-panel">
      <div class="panel-header">
        <h2>Ghi chú</h2>
        <button id="addNoteBtn" class="btn-primary">+ Thêm ghi chú</button>
      </div>

      <form id="noteForm" class="card form-card hidden">
        <div class="field">
          <label for="noteTitle">Tiêu đề</label>
          <input id="noteTitle" type="text" placeholder="VD: List comprehension" required>
        </div>
        <div class="field">
          <label for="noteDate">Ngày</label>
          <input id="noteDate" type="date">
        </div>
        <div class="field">
          <label for="noteContent">Nội dung</label>
          <textarea id="noteContent" rows="6" placeholder="Ghi lại điều bạn học được..." required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Lưu</button>
          <button type="button" id="cancelNoteBtn" class="btn-ghost">Hủy</button>
        </div>
      </form>

      <div id="noteList" class="note-grid"></div>
      <p id="noteEmpty" class="empty-state hidden">Chưa có ghi chú nào.</p>
    </section>

    <!-- LESSONS TAB -->
    <section id="lessons" class="tab-panel">
      <div class="panel-header">
        <h2>Bài học &amp; bài tập</h2>
        <button id="addLessonBtn" class="btn-primary">+ Thêm bài học</button>
      </div>

      <form id="lessonForm" class="card form-card hidden">
        <div class="field">
          <label for="lessonDate">Ngày</label>
          <input id="lessonDate" type="date" required>
        </div>
        <div class="field">
          <label for="lessonTitle">Chủ đề hôm nay</label>
          <input id="lessonTitle" type="text" placeholder="VD: Vòng lặp for/while" required>
        </div>
        <div class="field">
          <label for="lessonSummary">Nội dung bài học</label>
          <textarea id="lessonSummary" rows="4" placeholder="Tóm tắt kiến thức đã học..."></textarea>
        </div>
        <div class="field">
          <label for="lessonExercises">Bài tập (mỗi dòng một bài)</label>
          <textarea id="lessonExercises" rows="4" placeholder="VD:&#10;In ra bảng cửu chương&#10;Viết hàm kiểm tra số nguyên tố"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Lưu</button>
          <button type="button" id="cancelLessonBtn" class="btn-ghost">Hủy</button>
        </div>
      </form>

      <div id="lessonList" class="lesson-list"></div>
      <p id="lessonEmpty" class="empty-state hidden">Chưa có bài học nào.</p>
    </section>

    <!-- CALENDAR TAB -->
    <section id="calendar" class="tab-panel">
      <div class="panel-header">
        <h2>Lịch học tập</h2>
        <div class="calendar-controls">
          <button id="calPrevBtn" class="btn-ghost" aria-label="Tháng trước">&#8249;</button>
          <span id="calMonthLabel" class="cal-month-label"></span>
          <button id="calNextBtn" class="btn-ghost" aria-label="Tháng sau">&#8250;</button>
          <button id="calTodayBtn" class="btn-ghost">Hôm nay</button>
        </div>
      </div>

      <div class="calendar-legend">
        <span class="legend-item"><span class="dot dot-video"></span>Video</span>
        <span class="legend-item"><span class="dot dot-note"></span>Ghi chú</span>
        <span class="legend-item"><span class="dot dot-lesson"></span>Bài học</span>
      </div>

      <div class="calendar-weekdays">
        <span>CN</span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
  </main>

  <div id="dayModalOverlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="dayModalTitle"></h3>
        <button id="dayModalClose" class="btn-ghost">Đóng</button>
      </div>
      <div id="dayModalBody" class="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Dữ liệu được lưu ngay trên trình duyệt của bạn (localStorage).</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
